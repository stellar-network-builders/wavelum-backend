name: "E2E Pipeline — Green Light Gate"

# ─────────────────────────────────────────────────────────────────────────────
# This workflow is the "Ultimate Quality Gate" for Vesting Vault.
# It MUST pass before any deployment is allowed.
#
# Pipeline stages:
#   1. lint          — Fast static checks (fail fast)
#   2. unit-tests    — Backend Jest unit tests
#   3. contract-tests — Soroban smart contract tests (Rust)
#   4. e2e-tests     — Playwright API user-journey (auth lifecycle, in-memory backend)
#   5. green-light   — Summary gate job (required by branch protection rules)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop, "feature/*", "release/*"]
  pull_request:
    branches: [main, develop]
  # Allow manual runs for on-demand pre-deployment verification
  workflow_dispatch:
    inputs:
      skip_contracts:
        description: 'Skip smart contract tests (faster iteration)'
        required: false
        default: 'false'
        type: boolean

# Cancel in-progress runs on the same branch to save resources
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  RUST_TOOLCHAIN: stable

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Stage 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: "Lint & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check for syntax errors
        working-directory: backend
        run: node --check src/index.js

      - name: Generate and verify OpenAPI 3.1 specification & breaking-change diff
        working-directory: backend
        run: |
          npm run openapi:generate
          npm run openapi:diff

      - name: Upload OpenAPI 3.1 JSON artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: backend/openapi.json
          retention-days: 30

      - name: Run npm audit (high severity)
        working-directory: backend
        run: npm audit --audit-level=high --omit=dev || true

  # ── Stage 2: Unit Tests ──────────────────────────────────────────────────────
  unit-tests:
    name: "Backend Unit Tests"
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vesting_vault_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Create .env for tests
        working-directory: backend
        run: |
          cp .env.example .env
          echo "DB_HOST=localhost"     >> .env
          echo "DB_PORT=5432"         >> .env
          echo "DB_NAME=vesting_vault_test" >> .env
          echo "DB_USER=postgres"     >> .env
          echo "DB_PASSWORD=password" >> .env
          echo "NODE_ENV=test"        >> .env
          echo "JWT_SECRET=test-jwt-secret-e2e-pipeline" >> .env
          echo "JWT_REFRESH_SECRET=test-refresh-secret-e2e-pipeline" >> .env

      - name: Create data directory
        working-directory: backend
        run: mkdir -p data

      - name: Run Jest unit tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: vesting_vault_test

      # Quarantined suites (jest.quarantine.js): pre-existing failures inherited
      # from main, run here for visibility/burn-down but NON-BLOCKING.
      - name: Run quarantined tests (non-blocking)
        working-directory: backend
        continue-on-error: true
        run: npm run test:quarantine
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: password
          DB_NAME: vesting_vault_test

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-coverage
          path: backend/coverage/
          retention-days: 7

  # ── Detect whether the smart contracts changed ───────────────────────────────
  changes:
    name: "Detect changed paths"
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'

  # ── Stage 3: Smart Contract Tests ────────────────────────────────────────────
  contract-tests:
    name: "Soroban Smart Contract Tests"
    runs-on: ubuntu-latest
    needs: [lint, changes]
    # Skip the contract suite on pull requests that don't touch contracts/
    # (e.g. backend-only PRs) and when manually dispatched with
    # skip_contracts=true. Non-PR events still run it. Downstream jobs already
    # treat a skipped contract-tests result as success.
    if: ${{ github.event.inputs.skip_contracts != 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.contracts == 'true') }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (${{ env.RUST_TOOLCHAIN }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: |
          if ! command -v stellar &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev
            cargo install --locked stellar-cli
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          # Ensure stellar is the name used if the script installs it as stellar
          sudo cp $HOME/.cargo/bin/stellar /usr/local/bin/soroban || true
          sudo cp $HOME/.cargo/bin/stellar /usr/local/bin/stellar || true

      - name: Build vesting-vault contract
        run: |
          cd contracts/vesting-vault
          cargo build --target wasm32-unknown-unknown --release

      - name: Run contract unit tests
        run: |
          cd contracts/vesting-vault
          cargo test -- --nocapture

      # reentrancy-tests is a mis-architected WIP crate that does not compile
      # (excluded from the workspace — see contracts/Cargo.toml). Skip until it
      # is rewritten as a #[cfg(test)] module using the SDK-generated clients.
      - name: Run reentrancy protection tests
        run: echo "Skipping reentrancy-tests — excluded WIP crate, pending rewrite."

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: vesting-vault-wasm
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  # ── Stage 4: E2E Tests (Playwright API user journey) ─────────────────────────
  e2e-tests:
    name: "E2E User Journey (Playwright)"
    runs-on: ubuntu-latest
    needs: [unit-tests, contract-tests]
    # Run e2e even if contract-tests was skipped
    if: |
      always() &&
      needs.unit-tests.result == 'success' &&
      (needs.contract-tests.result == 'success' || needs.contract-tests.result == 'skipped')

    # No service containers required. The E2E suite drives the backend HTTP API
    # (auth lifecycle, health, protected routes), and the backend boots in
    # NODE_ENV=test mode with an ephemeral in-memory SQLite database — no
    # Postgres, Redis, or Stellar Quickstart needed. Playwright starts and stops
    # the backend itself via the `webServer` config in backend/playwright.config.js.
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright browser (chromium)
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Create backend .env
        working-directory: backend
        run: |
          cp .env.example .env
          echo "FIREBASE_SERVICE_ACCOUNT_PATH=" >> .env
          echo "JWT_SECRET=e2e-test-jwt-secret-not-for-production" >> .env
          echo "JWT_REFRESH_SECRET=e2e-test-refresh-secret-not-for-production" >> .env
          echo "TRANSPARENCY_PRIVATE_KEY=e2e-test-transparency-private-key" >> .env
          echo "TRANSPARENCY_PUBLIC_KEY=e2e-test-transparency-public-key" >> .env

      - name: Create data directory
        working-directory: backend
        run: mkdir -p data

      - name: Run Playwright E2E tests
        working-directory: backend
        run: npm run test:e2e
        env:
          CI: "true"
          NODE_ENV: test
          PORT: "4000"
          JWT_SECRET: e2e-test-jwt-secret-not-for-production
          JWT_REFRESH_SECRET: e2e-test-refresh-secret-not-for-production
          TRANSPARENCY_PRIVATE_KEY: e2e-test-transparency-private-key
          TRANSPARENCY_PUBLIC_KEY: e2e-test-transparency-public-key

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: backend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces & videos (on failure)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts
          path: backend/test-results/
          retention-days: 7

  # ── Stage 5: Green Light Gate ─────────────────────────────────────────────────
  green-light:
    name: "GREEN LIGHT — Deployment Approved"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, contract-tests, e2e-tests]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      (needs.contract-tests.result == 'success' || needs.contract-tests.result == 'skipped') &&
      needs.e2e-tests.result == 'success'

    steps:
      - name: All gates passed — Green Light
        run: |
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║                                                      ║"
          echo "║   ✅  GREEN LIGHT — Deployment Approved              ║"
          echo "║                                                      ║"
          echo "║   All quality gates passed:                          ║"
          echo "║   ✓ Lint & Static Analysis                           ║"
          echo "║   ✓ Backend Unit Tests                               ║"
          echo "║   ✓ Soroban Smart Contract Tests                     ║"
          echo "║   ✓ Playwright E2E User Journey                      ║"
          echo "║                                                      ║"
          echo "║   Branch: ${{ github.ref_name }}"
          echo "║   Commit: ${{ github.sha }}"
          echo "║   Run:    ${{ github.run_id }}"
          echo "╚══════════════════════════════════════════════════════╝"

  # Red light job — signals failure clearly in the PR checks list
  red-light:
    name: "RED LIGHT — Deployment Blocked"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, contract-tests, e2e-tests]
    if: |
      always() && (
        needs.lint.result == 'failure' ||
        needs.unit-tests.result == 'failure' ||
        needs.contract-tests.result == 'failure' ||
        needs.e2e-tests.result == 'failure'
      )

    steps:
      - name: Report blocking failures
        run: |
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║                                                      ║"
          echo "║   🔴  RED LIGHT — Deployment Blocked                 ║"
          echo "║                                                      ║"
          echo "║   One or more quality gates failed.                  ║"
          echo "║   Fix failing jobs before deploying.                 ║"
          echo "║                                                      ║"
          echo "║   Lint:      ${{ needs.lint.result }}"
          echo "║   Unit:      ${{ needs.unit-tests.result }}"
          echo "║   Contracts: ${{ needs.contract-tests.result }}"
          echo "║   E2E:       ${{ needs.e2e-tests.result }}"
          echo "╚══════════════════════════════════════════════════════╝"
          exit 1
