name: Lumina-etwork Tests

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: Verify pre-commit tooling configuration
        run: |
          test -f .husky/pre-commit
          test -x .husky/pre-commit
          test -f eslint.config.mjs
          bash -n .husky/pre-commit
          node --check eslint.config.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('.lintstagedrc.json', 'utf8'));
          const required = [
            '@eslint/js',
            '@typescript-eslint/eslint-plugin',
            '@typescript-eslint/parser',
            'eslint',
            'eslint-config-prettier',
            'globals',
            'husky',
            'lint-staged',
            'prettier',
          ];
          if (pkg.scripts?.postinstall !== 'husky') {
            throw new Error('package.json must install Husky from postinstall');
          }
          for (const dep of required) {
            if (!pkg.devDependencies?.[dep]) throw new Error(`missing devDependency: ${dep}`);
          }
          const codeTasks = config['*.{js,ts,tsx,jsx}'];
          if (!Array.isArray(codeTasks) || codeTasks.join('|') !== 'eslint --fix|prettier --write') {
            throw new Error('invalid JS/TS lint-staged pipeline');
          }
          if (config['*.{json,md,yaml,yml}'] !== 'prettier --write') {
            throw new Error('invalid docs/config lint-staged pipeline');
          }
          const hook = fs.readFileSync('.husky/pre-commit', 'utf8');
          if (!hook.includes('set -e')) throw new Error('pre-commit must abort on lint-staged failure');
          if (!hook.includes('npx lint-staged')) throw new Error('pre-commit must run lint-staged');
          if (!hook.includes('npm audit --audit-level=high --prefix backend')) {
            throw new Error('pre-commit must run informational high-severity npm audit');
          }
          NODE

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
        
      - name: Create environment file
        working-directory: ./backend
        run: cp .env.example .env
        
      - name: Create data directory
        working-directory: ./backend
        run: mkdir -p data
        
      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        
      - name: Generate coverage report
        working-directory: ./backend
        run: npm run test:coverage

      - name: Check for Soroban changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            soroban:
              - 'backend/src/services/soroban*.js'
              - 'contracts/**'

      - name: Run Soroban integration tests
        if: steps.filter.outputs.soroban == 'true'
        working-directory: ./backend
        run: npm run test:integration:soroban
