name: Lumina-etwork Tests

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
        
      - name: Create environment file
        working-directory: ./backend
        run: cp .env.example .env
        
      - name: Create data directory
        working-directory: ./backend
        run: mkdir -p data
        
      - name: Validate test structure
        run: node scripts/validate-test-structure.js

      - name: Run unit tests
        working-directory: ./backend
        run: npm run test:unit

      - name: Run integration tests
        working-directory: ./backend
        run: npm run test:integration

      - name: Install Playwright Chromium
        working-directory: ./backend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./backend
        run: npm run test:e2e
        
      - name: Generate coverage report
        working-directory: ./backend
        run: npm run test:coverage

      - name: Check for Soroban changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            soroban:
              - 'backend/src/services/soroban*.js'
              - 'contracts/**'

      - name: Run Soroban integration tests
        if: steps.filter.outputs.soroban == 'true'
        working-directory: ./backend
        run: npm run test:integration:soroban
